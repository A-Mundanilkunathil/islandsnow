<!DOCTYPE html>
<html lang="en">
<head>

  <title>Island Snow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

</head>
<body>
  <!-- top menubar with the social icons left and the account icons plus cart dropdown right -->
  <nav class="navbar bg-light">
    <div class="container">
      <ul class="nav">
        <li class="nav-item p-1"><a href="#"><i class="bi bi-facebook"></i></a></li>
        <li class="nav-item p-1"><a href="#"><i class="bi bi-twitter"></i></a></li>
        <li class="nav-item p-1"><a href="#"><i class="bi bi-pinterest"></i></a></li>
        <li class="nav-item p-1"><a href="#"><i class="bi bi-instagram"></i></a></li>
      </ul>
      <ul class="nav justify-content-end">
        <li class="nav-item p-1"><a href="#"><i class="bi bi-house-fill"></i></a></li>
        <li class="nav-item p-1"><a href="#"><i class="bi bi-search"></i></a></li>
        <li class="nav-item p-1"><a href="#"><i class="bi bi-person-fill"></i></a></li>
        <li class="nav-item p-1 dropdown">
          <a class="dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-cart"></i> 0
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">My Cart</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      <div class="col">
        <img src="islandsnow-logo.png" class="img-fluid rounded mx-auto d-block py-1" alt="Island Snow logo">
      </div>
    </div>
    <div class="row justify-content-center pt-4">
      <div class="col-1 fw-bold"><a class="dropdown-toggle" href="#">MEN</a></div>
      <div class="col-1 fw-bold"><a class="dropdown-toggle" href="#">WOMEN</a></div>
      <div class="col-1 fw-bold"><a class="dropdown-toggle" href="#">KIDS</a></div>
      <div class="col-1 fw-bold"><a class="dropdown-toggle" href="#">BRANDS</a></div>
      <div class="col-1 fw-bold"><a href="#">SEARCH</a></div>
    </div>
  </div>
  <div class="row justify-content-center m-0">
    <img src="islandsnow-main.png" class="img-fluid p-0" alt="Island Snow model on a bridge">
  </div>
  <!-- used AI to help build the page and check it against the example -->
